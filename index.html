    }

    .dancing-turkey {
      animation: turkeyDanceBody 0.9s ease-in-out infinite;
      transform-origin: 50% 80%;
    }
    .dancing-turkey .wing-left {
      transform-origin: 48px 46px;

    .dancing-turkey .wing-right {

    // =========================================================================
    // 2. APPLICATION STATE & GOOGLE SHEETS LIVE SYNC ENGINE
    // =========================================================================
    function getOrCreatePlayerId() {
      let pid = localStorage.getItem('bsh_roast_pid');
      if (!pid) {
        pid = 'CHEF-' + Math.random().toString(36).substring(2, 9).toUpperCase();
        localStorage.setItem('bsh_roast_pid', pid);
      }
      return pid;
    }

    const state = {
      lang: localStorage.getItem('bsh_roast_lang') || 'zh-TW',
      playerId: getOrCreatePlayerId(),
      nickname: localStorage.getItem('bsh_roast_nick') || '',
      step: 0,
      scores: { l1: 0, l2: 0, l3: 0, l4: 0, l5: 0, l6: 0 },
      l1: { sauce: 'herb', coverage: 0, strokes: [] },
      l2: { placed: [] },
      l3: { entryX: 245, entryY: 72, angle: 112, depth: 68 },
      l4: { temp: 65, fan: 60 }, // Core temp default 65°C (max 100°C, sweet spot 80-85°C)
      l5: { crispValue: 0, locked: false, holding: false },
      l6: { answered: null },

      isSheetConnected: true,
      onlineCount: 0,
      activeChefs: [],
      feedEvents: [],
      leaderboard: []
    };

    function t(key) {
      return (I18N[state.lang] && I18N[state.lang][key]) || I18N['zh-TW'][key] || key;
    }

    function getTotalScore() {
      return state.scores.l1 + state.scores.l2 + state.scores.l3 + state.scores.l4 + state.scores.l5 + state.scores.l6;
    }

    // Sync with Google Sheets Web App
    async function syncWithGoogleSheets(actionType = 'sync') {
      try {
        let res;
        if (actionType === 'sync') {
          res = await fetch(`${GAS_WEB_APP_URL}?action=sync`, { method: 'GET' });
        } else {
          res = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: actionType,
              playerId: state.playerId,
              nickname: state.nickname,
              score: getTotalScore(),
              breakdown: state.scores
            })
          });
        }
        const data = await res.json();
        if (data && data.ok) {
          state.isSheetConnected = true;
          state.onlineCount = data.onlineCount || (data.activeChefs ? data.activeChefs.length : 0);
          if (Array.isArray(data.activeChefs)) {
            state.activeChefs = data.activeChefs;
          }
          if (Array.isArray(data.leaderboard)) {
            state.leaderboard = data.leaderboard;
          }
          if (Array.isArray(data.events)) {
            state.feedEvents = data.events;
          }
          updateSyncStatusBadge();
          renderSidebarsAndModal();
        }
      } catch (err) {
        state.isSheetConnected = false;
        updateSyncStatusBadge();
      }
    }

    function updateSyncStatusBadge() {
      const dot = document.getElementById('sync-dot');
      const txt = document.getElementById('sync-text');
      if (!dot || !txt) return;
      if (state.isSheetConnected) {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
        txt.textContent = t('sync_connected');
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-amber-500';
        txt.textContent = t('sync_local');
      }
    }

    // Render Desktop Sidebars & Mobile Modal
    function renderSidebarsAndModal() {
      const countBadge = document.getElementById('online-count-badge');
      const desktopCount = document.getElementById('desktop-online-count');
      if (countBadge) countBadge.textContent = state.onlineCount;
      if (desktopCount) desktopCount.textContent = `${state.onlineCount} ${t('chefs_unit')}`;

      const chefsGrid = document.getElementById('desktop-chefs-grid');
      const mobileChefs = document.getElementById('mobile-chefs-list');
      const chefsHtml = state.activeChefs.slice(0, 16).map(c => {
        const isMe = c.name === state.nickname;
        const isDone = c.status === 'finished';
        return `
          <div class="px-2.5 py-2 rounded-xl border text-xs flex items-center gap-2 transition ${isMe ? 'bg-amber-100 border-bosch-red font-extrabold text-stone-900' : 'bg-amber-50/70 border-amber-200/80 text-stone-800'}">

            <div class="min-w-0 flex-1">
              <div class="truncate font-bold">${c.name}</div>
              <div class="text-[10px] ${isDone ? 'text-emerald-700 font-bold' : 'text-amber-700'}">

            </div>
          </div>
        `;
      }).join('');

      if (chefsGrid) chefsGrid.innerHTML = chefsHtml || `<div class="col-span-2 text-center text-xs text-stone-400 py-4">...</div>`;
      if (mobileChefs) {
        mobileChefs.innerHTML = state.activeChefs.slice(0, 16).map(c => `

      }

      const feedHtml = state.feedEvents.slice(0, 8).map(ev => {

      if (desktopFeed) desktopFeed.innerHTML = feedHtml;
      if (mobileFeed) mobileFeed.innerHTML = feedHtml;

      const sorted = [...state.leaderboard].sort((a, b) => b.score - a.score);

        } else {

        }
      }
      if (mobileMyRank) mobileMyRank.textContent = rankText;

      const lbHtml = sorted.slice(0, 10).map((item, idx) => {
        const isMe = item.name === state.nickname;
        const medal = idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : `${idx + 1}`));
        return `
          <div class="flex items-center justify-between px-3 py-2 rounded-xl border text-xs ${isMe ? 'bg-amber-100 border-bosch-red font-extrabold text-stone-900 shadow-xs' : 'bg-stone-50/90 border-stone-200/80 text-stone-700'}">

            </div>
            <span class="font-extrabold text-bosch-red shrink-0">${item.score} pts</span>
          </div>
        `;
      }).join('');

      const desktopLb = document.getElementById('desktop-leaderboard');
      const mobileLb = document.getElementById('leaderboard-list');
      if (desktopLb) desktopLb.innerHTML = lbHtml;
      if (mobileLb) mobileLb.innerHTML = lbHtml;
    }

    function toggleLanguage() {
      state.lang = state.lang === 'zh-TW' ? 'en' : 'zh-TW';
      localStorage.setItem('bsh_roast_lang', state.lang);
      document.documentElement.lang = state.lang;
      updateLangButtonUI();
      renderCurrentStep();
      renderSidebarsAndModal();
    }

    function updateLangButtonUI() {
      const zhEl = document.getElementById('lang-label-zh');
      const enEl = document.getElementById('lang-label-en');
      if (state.lang === 'zh-TW') {
        zhEl.className = 'opacity-100 underline decoration-2 underline-offset-4';
        enEl.className = 'opacity-75';
      } else {
        zhEl.className = 'opacity-75';
        enEl.className = 'opacity-100 underline decoration-2 underline-offset-4';
      }
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
      });
      updateSyncStatusBadge();
    }

    function showToast(msg, icon = '✨') {
      const banner = document.getElementById('toast-banner');
      document.getElementById('toast-icon').textContent = icon;
      document.getElementById('toast-msg').textContent = msg;
      banner.classList.remove('opacity-0', '-translate-y-2');
      banner.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', '-translate-y-2');
      }, 2500);
    }

      const stage = document.getElementById('app-stage');
      if (state.step === 0) {
        stage.innerHTML = renderIntroHTML();
      } else if (state.step === 1) {
        stage.innerHTML = renderL1HTML();

      } else if (state.step === 2) {
        stage.innerHTML = renderL2HTML();

      } else if (state.step === 3) {

        initL3Canvas();
      } else if (state.step === 4) {

      } else if (state.step === 5) {

      } else if (state.step === 6) {
        stage.innerHTML = renderL6HTML();
      } else if (state.step === 7) {
        stage.innerHTML = renderResultHTML();
      }
      updateLangButtonUI();
    }

    function startGame() {

    function resetL1Canvas() {
      state.l1.strokes = [];

    function initL1Canvas() {
      const canvas = document.getElementById('l1-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const sauceColors = {
        herb: 'rgba(217, 119, 6, 0.35)',
        maple: 'rgba(194, 65, 12, 0.35)',
        citrus: 'rgba(234, 179, 8, 0.35)'
      };

      function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.arc(180, 135, 115, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#E5E7EB';
        ctx.stroke();

        drawTopDownTurkeyOnCanvas(ctx, 180, 135, 1.35);

        state.l1.strokes.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 11, 0, Math.PI * 2);
          ctx.fillStyle = sauceColors[state.l1.sauce] || sauceColors.herb;
          ctx.fill();
        });
      }

      redraw();

      let painting = false;
      function addPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const x = ((clientX - rect.left) / rect.width) * canvas.width;
        const y = ((clientY - rect.top) / rect.height) * canvas.height;
        const dist = Math.hypot(x - 180, y - 135);
        if (dist < 95) {
          state.l1.strokes.push({ x, y });
          const cov = Math.min(100, Math.round((state.l1.strokes.length / 55) * 100));
          state.l1.coverage = cov;
          state.scores.l1 = Math.min(15, Math.round((cov / 100) * 15));
          const covEl = document.getElementById('l1-cov-text');
          if (covEl) covEl.textContent = cov + '%';
          redraw();
        }
      }

      canvas.onpointerdown = (e) => {
        painting = true;
        canvas.setPointerCapture(e.pointerId);
        addPoint(e.clientX, e.clientY);
      };
      canvas.onpointermove = (e) => {
        if (!painting) return;
        addPoint(e.clientX, e.clientY);
      };
      canvas.onpointerup = () => { painting = false; };
    }

              }).join('')}

              <div class="absolute bottom-2 left-1/2 -translate-x-1/2 pointer-events-none bg-white/90 px-3 py-1 rounded-full text-[10px] font-semibold text-stone-600 border border-stone-200 whitespace-nowrap">

    function resetL2Veggies() {
      state.l2.placed = [];
      state.scores.l2 = 0;
      renderCurrentStep();

    function computeL2Score() {
      const count = Math.min(6, state.l2.placed.length);
      const uniqueTypes = new Set(state.l2.placed.map(v => v.type)).size;
      const base = Math.round((count / 6) * 12);
      const bonus = uniqueTypes >= 3 ? 3 : (uniqueTypes === 2 ? 2 : 0);
      state.scores.l2 = Math.min(15, base + bonus);
    }

    function initL2DragAndDrop() {
      const chips = document.querySelectorAll('.veggie-chip');
      const tray = document.getElementById('l2-tray');
      if (!tray) return;

      chips.forEach(chip => {
        chip.onpointerdown = (e) => {
          e.preventDefault();
          const type = chip.getAttribute('data-veg-type');
          const emoji = type === 'carrot' ? '🥕' : (type === 'potato' ? '🥔' : '🥦');

          const ghost = document.createElement('div');
          ghost.textContent = emoji;
          ghost.className = 'fixed z-50 text-3xl pointer-events-none -translate-x-1/2 -translate-y-1/2 drop-shadow-lg';
          ghost.style.left = e.clientX + 'px';
          ghost.style.top = e.clientY + 'px';
          document.body.appendChild(ghost);

          const onMove = (ev) => {
            ghost.style.left = ev.clientX + 'px';
            ghost.style.top = ev.clientY + 'px';
          };

          const onUp = (ev) => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
            ghost.remove();

            const rect = tray.getBoundingClientRect();
            if (ev.clientX >= rect.left && ev.clientX <= rect.right && ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
              const xPct = ((ev.clientX - rect.left) / rect.width) * 100;
              const yPct = ((ev.clientY - rect.top) / rect.height) * 100;
              const distFromCenter = Math.hypot(xPct - 50, yPct - 50);
              if (distFromCenter < 22) {
                showToast(t('l2_warn_turkey'), '🦃');
                return;
              }
              if (state.l2.placed.length < 9) {
                state.l2.placed.push({ id: Date.now(), type, xPct, yPct });
                computeL2Score();
                renderCurrentStep();
              }
            } else {
              showToast(t('l2_warn_outside'), '🍽️');
            }
          };

          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        };
      });
    }

    // =========================================================================
    // 8. LEVEL 3: PERFECTROAST PLUS 2D CROSS-SECTION PROBE
    // =========================================================================
    function renderL3HTML() {
      return `
        <div class="space-y-3">
          <div class="glass-panel rounded-3xl p-4 sm:p-5 space-y-3">
            <div class="flex items-center justify-between">

              <span class="text-xs font-bold text-bosch-red">PerfectRoast Plus</span>
            </div>
            <h2 class="text-lg sm:text-xl font-extrabold text-stone-900">${t('l3_title')}</h2>
            <p class="text-xs text-stone-600 leading-relaxed">${t('l3_desc')}</p>

            <div class="relative w-full aspect-[16/10] bg-amber-50/70 rounded-2xl border border-amber-300 overflow-hidden">
              <canvas id="l3-canvas" width="400" height="250" class="w-full h-full touch-none cursor-grab"></canvas>
            </div>

            <div class="grid grid-cols-2 gap-3 pt-1">
              <div class="bg-amber-50/90 border border-amber-200 rounded-2xl p-3 space-y-1.5">
                <div class="flex justify-between text-xs font-bold text-stone-800">
                  <span>${t('probe_angle_label')}</span>
                  <span id="l3-angle-val" class="text-bosch-red">${state.l3.angle}°</span>
                </div>
                <input id="l3-angle-slider" type="range" min="35" max="155" value="${state.l3.angle}"
                  oninput="updateL3FromSlider('angle', this.value)"
                  onchange="updateL3FromSlider('angle', this.value)"
                  class="w-full" />
              </div>

              <div class="bg-amber-50/90 border border-amber-200 rounded-2xl p-3 space-y-1.5">
                <div class="flex justify-between text-xs font-bold text-stone-800">
                  <span>${t('probe_depth_label')}</span>
                  <span id="l3-depth-val" class="text-bosch-red">${state.l3.depth} mm</span>
                </div>
                <input id="l3-depth-slider" type="range" min="25" max="115" value="${state.l3.depth}"
                  oninput="updateL3FromSlider('depth', this.value)"
                  onchange="updateL3FromSlider('depth', this.value)"
                  class="w-full" />
              </div>
            </div>

            <div class="bg-stone-50 border border-stone-200 rounded-2xl p-3 space-y-1 text-[11px] text-stone-700 leading-relaxed">
              <div>${t('probe_tip_1')}</div>
              <div>${t('probe_tip_2')}</div>
              <div class="text-[10px] text-stone-400 pt-1">${t('probe_disclaimer')}</div>
            </div>

            <button onclick="finalizeL3AndNext()" class="w-full py-3.5 rounded-2xl bosch-red-gradient text-white font-extrabold text-sm shadow-md hover:brightness-105 transition">
              ${t('next_level_btn')} →
            </button>
          </div>

      `;
    }

    function updateL3FromSlider(prop, val) {
      state.l3[prop] = Number(val);
      const angleLabel = document.getElementById('l3-angle-val');
      const depthLabel = document.getElementById('l3-depth-val');
      if (angleLabel) angleLabel.textContent = state.l3.angle + '°';
      if (depthLabel) depthLabel.textContent = state.l3.depth + ' mm';
      evaluateProbeSilently();
      if (window._drawL3Canvas) window._drawL3Canvas();
    }

    function getProbeGeometry() {
      const rad = (state.l3.angle * Math.PI) / 180;
      const sx = state.l3.entryX;
      const sy = state.l3.entryY;
      const len = state.l3.depth;
      const tipX = sx + Math.cos(rad) * len;
      const tipY = sy + Math.sin(rad) * len;
      const sensors = [0.45, 0.72, 0.98].map(ratio => ({
        x: sx + Math.cos(rad) * (len * ratio),
        y: sy + Math.sin(rad) * (len * ratio)
      }));
      return { sx, sy, tipX, tipY, sensors };
    }

    function classifyPointZone(x, y) {
      const normMeat = Math.pow((x - 200) / 125, 2) + Math.pow((y - 145) / 68, 2);
      if (normMeat > 1.0) return 'air';

      const normCavity = Math.pow((x - 205) / 55, 2) + Math.pow((y - 168) / 24, 2);
      if (normCavity <= 1.0) return 'cavity';

      const normBone = Math.pow((x - 185) / 26, 2) + Math.pow((y - 134) / 9, 2);
      if (normBone <= 1.0) return 'bone';

      return 'meat';
    }

    function evaluateProbeSilently() {
      const { sx, sy, sensors } = getProbeGeometry();
      const entryDist = Math.hypot(sx - 230, sy - 85);
      const posScore = entryDist < 35 ? 8 : (entryDist < 65 ? 6 : 3);

      let meatHits = 0;
      let boneHits = 0;
      let cavityHits = 0;
      sensors.forEach(pt => {
        const z = classifyPointZone(pt.x, pt.y);
        if (z === 'meat') meatHits++;
        else if (z === 'bone') boneHits++;
        else if (z === 'cavity') cavityHits++;
      });

      let depthScore = Math.round((meatHits / 3) * 7);
      if (boneHits > 0) depthScore = Math.max(1, depthScore - 3);
      if (cavityHits > 0) depthScore = Math.max(1, depthScore - 2);

      const angleDiff = Math.abs(state.l3.angle - 115);
      const angleScore = angleDiff <= 15 ? 5 : (angleDiff <= 30 ? 3 : 1);

      state.scores.l3 = Math.min(20, posScore + depthScore + angleScore);
    }

    function finalizeL3AndNext() {
      evaluateProbeSilently();
      nextStep(4);
    }

    function initL3Canvas() {
      const canvas = document.getElementById('l3-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(217, 119, 36, 0.12)';
        ctx.lineWidth = 1;
        for (let gx = 0; gx < canvas.width; gx += 25) {
          ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
        }
        for (let gy = 0; gy < canvas.height; gy += 25) {
          ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
        }

        ctx.beginPath();
        ctx.ellipse(200, 145, 125, 68, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#FDBA74';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#9A3412';
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(205, 168, 55, 24, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#FEF3C7';
        ctx.fill();
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#D97706';
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.ellipse(185, 134, 26, 9, -0.15, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#78716C';
        ctx.stroke();

        ctx.fillStyle = '#7C2D12';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText(state.lang === 'zh-TW' ? '火雞胸肉層' : 'Breast Meat', 105, 125);
        ctx.fillStyle = '#57534E';
        ctx.fillText(state.lang === 'zh-TW' ? '胸骨' : 'Bone', 173, 137);
        ctx.fillStyle = '#B45309';
        ctx.fillText(state.lang === 'zh-TW' ? '腹腔' : 'Cavity', 193, 172);

        const { sx, sy, tipX, tipY, sensors } = getProbeGeometry();
        const rad = (state.l3.angle * Math.PI) / 180;
        const handleX = sx - Math.cos(rad) * 28;
        const handleY = sy - Math.sin(rad) * 28;

        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(tipX, tipY);
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#44403C';
        ctx.lineCap = 'round';
        ctx.stroke();

        sensors.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = '#D97724';
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = '#FFFFFF';
          ctx.stroke();
        });

        ctx.beginPath();
        ctx.moveTo(handleX, handleY);
        ctx.lineTo(sx, sy);
        ctx.lineWidth = 11;
        ctx.strokeStyle = '#1C1917';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(handleX, handleY, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#E20015';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();
      }

      window._drawL3Canvas = draw;
      evaluateProbeSilently();
      draw();

      let dragMode = null;
      canvas.onpointerdown = (e) => {
        const rect = canvas.getBoundingClientRect();
        const px = ((e.clientX - rect.left) / rect.width) * canvas.width;
        const py = ((e.clientY - rect.top) / rect.height) * canvas.height;
        const { sx, sy, tipX, tipY } = getProbeGeometry();
        const rad = (state.l3.angle * Math.PI) / 180;
        const handleX = sx - Math.cos(rad) * 28;
        const handleY = sy - Math.sin(rad) * 28;

        if (Math.hypot(px - handleX, py - handleY) < 30 || Math.hypot(px - sx, py - sy) < 25) {
          dragMode = 'handle';
          canvas.setPointerCapture(e.pointerId);
        } else if (Math.hypot(px - tipX, py - tipY) < 35) {
          dragMode = 'tip';
          canvas.setPointerCapture(e.pointerId);
        }
      };

      canvas.onpointermove = (e) => {
        if (!dragMode) return;
        const rect = canvas.getBoundingClientRect();
        const px = ((e.clientX - rect.left) / rect.width) * canvas.width;
        const py = ((e.clientY - rect.top) / rect.height) * canvas.height;

        if (dragMode === 'handle') {
          state.l3.entryX = Math.max(85, Math.min(315, Math.round(px)));
          state.l3.entryY = Math.max(45, Math.min(130, Math.round(py)));
        } else if (dragMode === 'tip') {
          const dx = px - state.l3.entryX;
          const dy = py - state.l3.entryY;
          const deg = Math.round((Math.atan2(dy, dx) * 180) / Math.PI);
          const dist = Math.round(Math.hypot(dx, dy));
          state.l3.angle = Math.max(35, Math.min(155, deg));
          state.l3.depth = Math.max(25, Math.min(115, dist));
          const aSlider = document.getElementById('l3-angle-slider');
          const dSlider = document.getElementById('l3-depth-slider');
          const aVal = document.getElementById('l3-angle-val');
          const dVal = document.getElementById('l3-depth-val');
          if (aSlider) aSlider.value = state.l3.angle;
          if (dSlider) dSlider.value = state.l3.depth;
          if (aVal) aVal.textContent = state.l3.angle + '°';
          if (dVal) dVal.textContent = state.l3.depth + ' mm';
        }
        evaluateProbeSilently();
        draw();
      };

      canvas.onpointerup = () => { dragMode = null; };
    }

    // =========================================================================
    // 9. LEVEL 4: CORE TEMPERATURE (MAX 100°C, SWEET SPOT 80-85°C) & 4D HOTAIR
    // =========================================================================
    function computeL4Uniformity() {
      // Core temp ideal band: 80°C - 85°C (center 82.5°C)
      let coreDist = 0;
      if (state.l4.temp < 80) {
        coreDist = 80 - state.l4.temp;
      } else if (state.l4.temp > 85) {
        coreDist = state.l4.temp - 85;
      }
      // Within 80-85°C gives 100% core score; outside decays smoothly
      const coreQuality = Math.max(15, Math.round(100 - coreDist * 2.2));

      const fanDiff = Math.abs(state.l4.fan - 80);
      const fanQuality = Math.max(30, Math.round(100 - fanDiff * 0.8));

      const combinedQuality = Math.round(coreQuality * 0.7 + fanQuality * 0.3);
      state.scores.l4 = Math.max(2, Math.min(20, Math.round((combinedQuality / 100) * 20)));
      return combinedQuality;
    }

    function updateL4Slider(prop, val) {
      state.l4[prop] = Number(val);
      const uni = computeL4Uniformity();
      const tempText = document.getElementById('l4-temp-text');
      const fanText = document.getElementById('l4-fan-text');
      const uniText = document.getElementById('l4-uni-text');
      const uniBar = document.getElementById('l4-uni-bar');
      if (tempText) tempText.textContent = state.l4.temp + '°C';
      if (fanText) fanText.textContent = state.l4.fan + '%';
      if (uniText) uniText.textContent = uni + '%';
      if (uniBar) uniBar.style.width = uni + '%';
    }

    // =========================================================================
    // 10. LEVEL 5: ADDED STEAM CRISPY FINISH
    // =========================================================================
    let l5Timer = null;
    function startCrispHold() {
      if (state.l5.locked) return;
      state.l5.holding = true;
      clearInterval(l5Timer);
      l5Timer = setInterval(() => {
        state.l5.crispValue = Math.min(100, state.l5.crispValue + 2.5);
        const bar = document.getElementById('l5-bar');
        const txt = document.getElementById('l5-val-text');
        if (bar) bar.style.width = state.l5.crispValue + '%';
        if (txt) txt.textContent = Math.round(state.l5.crispValue) + '%';
        if (state.l5.crispValue >= 100) {
          releaseCrispHold();
        }
      }, 40);
    }

    function releaseCrispHold() {
      if (!state.l5.holding) return;
      state.l5.holding = false;
      state.l5.locked = true;
      clearInterval(l5Timer);
      const diff = Math.abs(state.l5.crispValue - 80);
      state.scores.l5 = Math.max(5, Math.min(15, Math.round(15 - diff * 0.25)));
      renderCurrentStep();
    }

    function renderL5HTML() {
      return `
        <div class="space-y-3">
          <div class="glass-panel rounded-3xl p-4 sm:p-5 space-y-4">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-900 text-xs font-extrabold">${t('level_badge')} 5 / 6</span>

                💨 ${t('hold_crisp_btn')}

            ` : `
              <div class="text-center text-xs font-extrabold text-emerald-700 bg-emerald-50 border border-emerald-200 py-2.5 rounded-xl">
                ✅ ${t('crisp_locked')} (${Math.round(state.l5.crispValue)}%)
              </div>
              <button onclick="nextStep(6)" class="w-full py-3.5 rounded-2xl bosch-red-gradient text-white font-extrabold text-sm shadow-md hover:brightness-105 transition">
                ${t('next_level_btn')} →

    // =========================================================================
    // 11. LEVEL 6: ACTIVECLEAN PYROLYTIC SELF-CLEANING BOSS
    // =========================================================================
    function answerL6(idx) {
      if (state.l6.answered !== null) return;
      state.l6.answered = idx;
      state.scores.l6 = idx === 0 ? 15 : 5;
      state.feedEvents.unshift({ type: 'feed_clean', name: state.nickname, score: getTotalScore() });
      renderSidebarsAndModal();
      renderCurrentStep();
    }

    function renderL6HTML() {
      const options = [t('quiz_opt_0'), t('quiz_opt_1'), t('quiz_opt_2')];
      return `
        <div class="space-y-3">
          <div class="glass-panel rounded-3xl p-4 sm:p-5 space-y-4">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-full bg-amber-100 text-amber-900 text-xs font-extrabold">${t('level_badge')} 6 / 6</span>
              <span class="text-xs font-bold text-bosch-red">activeClean</span>

                if (state.l6.answered !== null) {
                  if (idx === 0) cls = 'bg-emerald-50 border-emerald-500 text-emerald-950 font-bold';
                  else if (idx === state.l6.answered) cls = 'bg-red-50 border-red-400 text-red-900';
                }
                return `
                  <button onclick="answerL6(${idx})" class="w-full text-left p-3.5 rounded-2xl border text-xs leading-relaxed transition ${cls}">
                    <span class="font-extrabold mr-1.5">${['A.', 'B.', 'C.'][idx]}</span>${opt}
                  </button>
                `;
              }).join('')}
            </div>

            ${state.l6.answered !== null ? `
              <div class="p-3 rounded-2xl text-xs leading-relaxed ${state.l6.answered === 0 ? 'bg-emerald-50 text-emerald-900 border border-emerald-200' : 'bg-amber-50 text-amber-950 border border-amber-200'}">
                ${state.l6.answered === 0 ? t('quiz_correct') : t('quiz_wrong')}
              </div>
              <button onclick="finishGame()" class="w-full py-3.5 rounded-2xl bosch-red-gradient text-white font-extrabold text-sm shadow-md hover:brightness-105 transition">
                ${t('finish_game_btn')} 🎉
              </button>

          </div>
        </div>
      `;
    }

    function finishGame() {
      const total = getTotalScore();

      const existingChef = state.activeChefs.find(c => c.name === state.nickname);
      if (existingChef) {
        existingChef.status = 'finished';
        existingChef.score = Math.max(existingChef.score || 0, total);
      } else {
        state.activeChefs.unshift({ name: state.nickname, status: 'finished', score: total });
      }

      const existingLb = state.leaderboard.find(item => item.name === state.nickname);
      if (existingLb) {
        existingLb.score = Math.max(existingLb.score, total);
      } else {
        state.leaderboard.push({ name: state.nickname, score: total });
      }
      state.leaderboard.sort((a, b) => b.score - a.score);
      state.feedEvents.unshift({ type: 'feed_high_score', name: state.nickname, score: total });

      renderSidebarsAndModal();
      syncWithGoogleSheets('finish');

      state.step = 7;
      renderCurrentStep();
    }

    // =========================================================================
    // 12. FINAL RESULT SCREEN
    // =========================================================================
    function getFunnyReview(total) {
      if (total >= 85) return t('review_high');
      if (total >= 65) return t('review_mid');
      return t('review_low');
    }

    function getChefTitle(total) {
      if (total >= 85) return t('rank_master');
      if (total >= 65) return t('rank_pro');
      return t('rank_rookie');
    }

    function renderResultHTML() {
      const total = getTotalScore();
      const title = getChefTitle(total);
      const funnyComment = getFunnyReview(total);

      const breakdown = [
        { label: t('res_l1'), val: state.scores.l1, max: 15 },
        { label: t('res_l2'), val: state.scores.l2, max: 15 },
        { label: t('res_l3'), val: state.scores.l3, max: 20 },
        { label: t('res_l4'), val: state.scores.l4, max: 20 },
        { label: t('res_l5'), val: state.scores.l5, max: 15 },
        { label: t('res_l6'), val: state.scores.l6, max: 15 }
      ];

      return `
        <div class="space-y-4 pb-6">
          <!-- 1. Hero Score & Dancing Turkey Card -->
          <div class="glass-panel rounded-3xl p-5 text-center space-y-3">
            <div class="text-xs font-extrabold tracking-wider uppercase text-amber-800">${t('res_title')}</div>
            <h2 class="text-xl sm:text-2xl font-extrabold text-stone-900">🔥 ${title}</h2>
            <div class="text-xs font-bold text-stone-500">${state.nickname}</div>

            <div class="relative bg-gradient-to-b from-amber-50 to-orange-100/70 border border-amber-300 rounded-3xl py-5 px-4 space-y-2 overflow-hidden">
              <span class="music-note-1 absolute top-4 left-8 text-xl">🎵</span>
              <span class="music-note-2 absolute top-6 right-8 text-xl">🎶</span>
              ${getTopDownTurkeySVG(135, true)}
              <div class="pt-1">
                <span class="text-4xl sm:text-5xl font-black text-amber-600">${total}</span>
                <span class="text-sm font-bold text-stone-500"> / 100</span>
              </div>
              <div class="text-[10px] font-bold tracking-widest text-stone-500 uppercase">BOSCH HRG978NB1 THANKSGIVING MASTER</div>
            </div>

            <div class="bg-amber-100/80 border border-amber-300 rounded-2xl p-3 text-xs sm:text-sm font-bold text-amber-950 leading-relaxed">
              💬 「${funnyComment}」
            </div>
          </div>

          <!-- 2. BSH Employee Shop Promotional CTA -->
          <div class="glass-panel rounded-3xl p-5 border-2 border-bosch-red/30 bg-gradient-to-br from-white to-red-50/40 space-y-3 text-center">
            <div class="inline-block px-3 py-0.5 rounded-full bg-bosch-red/10 text-bosch-red text-[11px] font-extrabold tracking-wide">
              ${t('shop_cta_badge')}
            </div>
            <div class="text-sm font-extrabold text-stone-900 leading-snug">
              ${t('shop_cta_text')}
            </div>
            <p class="text-xs text-stone-600 leading-relaxed">
              <strong>${t('prod_title')}</strong> — ${t('prod_desc')}

              class="block w-full py-3.5 rounded-2xl bosch-red-gradient text-white font-extrabold text-sm shadow-lg shadow-red-600/20 hover:brightness-105 transition">
              ${t('shop_cta_btn')}

              ${breakdown.map(b => `
                <div class="bg-amber-50/80 border border-amber-200/80 rounded-xl p-2.5 flex items-center justify-between text-xs">
                  <span class="font-semibold text-stone-700 truncate pr-1">${b.label}</span>
                  <span class="font-extrabold text-bosch-red shrink-0">${b.val}/${b.max}</span>

              `).join('')}

          <!-- 4. Download Roast Turkey PNG Button & Replay -->

              🍗 ${t('download_card_btn')}

            <button onclick="resetFullGame()" class="w-full py-3 rounded-2xl bg-white hover:bg-stone-100 border border-stone-300 text-stone-700 font-bold text-xs transition">
              🔄 ${t('play_again_btn')}
            </button>
          </div>
        </div>
      `;
    }

    function resetFullGame() {
      state.step = 1;
      state.scores = { l1: 0, l2: 0, l3: 0, l4: 0, l5: 0, l6: 0 };
      state.l1 = { sauce: 'herb', coverage: 0, strokes: [] };
      state.l2 = { placed: [] };
      state.l3 = { entryX: 245, entryY: 72, angle: 112, depth: 68 };
      state.l4 = { temp: 65, fan: 60 };
      state.l5 = { crispValue: 0, locked: false, holding: false };
      state.l6 = { answered: null };
      renderCurrentStep();
    }

    // =========================================================================
    // 13. KEEPSAKE PNG GENERATOR
    // =========================================================================
    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const chars = Array.from(text);
      let line = '';
      let curY = y;
      for (let i = 0; i < chars.length; i++) {
        const testLine = line + chars[i];
        if (ctx.measureText(testLine).width > maxWidth && i > 0) {
          ctx.fillText(line, x, curY);
          line = chars[i];
          curY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, curY);
    }

    function generateCertificateCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 800;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');
      const total = getTotalScore();
      const review = getFunnyReview(total);

      ctx.fillStyle = '#FFFDF9';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#D97724';
      ctx.lineWidth = 10;
      ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';

      ctx.fillStyle = '#E20015';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('BOSCH accent|line Series 8 HRG978NB1', 52, 54);

      ctx.fillStyle = '#1C1917';
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText(state.lang === 'zh-TW' ? '感恩節黃金烤雞成果卡 🍗' : 'Thanksgiving Roast Keepsake 🍗', 52, 92);

      ctx.fillStyle = '#D97706';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText(`${state.nickname} — ${total} / 100 PTS`, 52, 146);

      ctx.fillStyle = '#57534E';
      ctx.font = '16px sans-serif';
      ctx.fillText('BSH Home Appliances Taiwan 2026 Thanksgiving', 52, 188);

      ctx.fillStyle = '#FEF3C7';
      ctx.fillRect(52, 226, 420, 108);
      ctx.strokeStyle = '#F59E0B';
      ctx.lineWidth = 2;
      ctx.strokeRect(52, 226, 420, 108);

      ctx.fillStyle = '#78350F';
      ctx.font = 'bold 17px sans-serif';
      wrapCanvasText(ctx, `「${review}」`, 68, 244, 388, 26);

      ctx.beginPath();
      ctx.arc(140, 392, 46, 0, Math.PI * 2);
      ctx.strokeStyle = '#E20015';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#E20015';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('BOSCH AI', 140, 378);
      ctx.fillText('ROASTED!', 140, 396);

      ctx.beginPath();
      ctx.arc(620, 270, 125, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#0284C7';
      ctx.stroke();

      drawTopDownTurkeyOnCanvas(ctx, 620, 270, 1.35);

      return canvas;
    }

    function downloadKeepsakeCard() {
      const canvas = generateCertificateCanvas();
      const link = document.createElement('a');
      link.download = `BSH-Thanksgiving-Turkey-${state.nickname || 'Chef'}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast(t('card_downloaded_toast'), '🍗');
    }

    // =========================================================================
    // 14. MOBILE DRAWER & AUTO-POLLING INIT
    // =========================================================================
    function toggleSocialModal() {
      const modal = document.getElementById('social-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        renderSidebarsAndModal();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.documentElement.lang = state.lang;
      updateLangButtonUI();
      renderCurrentStep();
      renderSidebarsAndModal();

      // Initial sync & 4-second polling with Google Sheets
      syncWithGoogleSheets('sync');
      setInterval(() => {
        syncWithGoogleSheets('sync');
      }, 4000);
    });
  </script>
