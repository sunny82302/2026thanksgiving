    .animate-wing-l {
      animation: wingFlapLeft 0.48s ease-in-out infinite;
      transform-origin: 68px 65px;

    .animate-wing-r {

    function drawTopDownTurkeyOnCanvas(ctx, cx, cy, scale = 0.85) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.translate(-110, -110);

      const skinBase = '#F4AD59';
      const skinShadow = '#E2903D';
      const highlight = '#FAD38C';
      const outline = '#78280C';

      ctx.lineWidth = 5;
      ctx.strokeStyle = outline;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // Left Wing
      ctx.fillStyle = skinBase;
      ctx.beginPath();
      ctx.moveTo(68, 55);
      ctx.bezierCurveTo(48, 26, 36, 52, 22, 76);
      ctx.bezierCurveTo(20, 80, 26, 83, 42, 74);
      ctx.bezierCurveTo(46, 86, 54, 96, 65, 92);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Right Wing
      ctx.beginPath();
      ctx.moveTo(152, 55);
      ctx.bezierCurveTo(172, 26, 184, 52, 198, 76);
      ctx.bezierCurveTo(200, 80, 194, 83, 178, 74);
      ctx.bezierCurveTo(174, 86, 166, 96, 155, 92);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Main Body
      ctx.beginPath();
      ctx.moveTo(110, 42);
      ctx.bezierCurveTo(134, 32, 162, 46, 160, 88);
      ctx.bezierCurveTo(158, 124, 130, 156, 110, 156);
      ctx.bezierCurveTo(90, 156, 62, 124, 60, 88);
      ctx.bezierCurveTo(58, 46, 86, 32, 110, 42);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Shading
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = skinShadow;
      ctx.beginPath();
      ctx.moveTo(152, 72);
      ctx.bezierCurveTo(154, 114, 128, 148, 110, 150);
      ctx.bezierCurveTo(98, 150, 86, 142, 78, 134);
      ctx.bezierCurveTo(106, 138, 138, 112, 146, 66);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Highlight
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = highlight;
      ctx.beginPath();
      ctx.ellipse(86, 78, 11, 22, (-12 * Math.PI) / 180, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Center Breast Lines
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(110, 62);
      ctx.lineTo(110, 82);
      ctx.moveTo(110, 92);
      ctx.lineTo(110, 114);
      ctx.stroke();

      // Left Drumstick
      ctx.lineWidth = 5;
      ctx.fillStyle = skinBase;
      ctx.beginPath();
      ctx.moveTo(66, 108);
      ctx.bezierCurveTo(42, 102, 34, 126, 46, 148);
      ctx.bezierCurveTo(56, 164, 68, 176, 70, 184);
      ctx.bezierCurveTo(66, 190, 70, 198, 78, 195);
      ctx.bezierCurveTo(86, 198, 90, 190, 86, 184);
      ctx.bezierCurveTo(86, 172, 86, 154, 82, 136);
      ctx.fill();
      ctx.stroke();

      // Right Drumstick
      ctx.beginPath();
      ctx.moveTo(154, 108);
      ctx.bezierCurveTo(178, 102, 186, 126, 174, 148);
      ctx.bezierCurveTo(164, 164, 152, 176, 150, 184);
      ctx.bezierCurveTo(154, 190, 150, 198, 142, 195);
      ctx.bezierCurveTo(134, 198, 130, 190, 134, 184);
      ctx.bezierCurveTo(134, 172, 134, 154, 138, 136);
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function initL1Canvas() {
      const canvas = document.getElementById('basteCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const sauceColors = {
        herb: 'rgba(132, 204, 22, 0.45)',
        maple: 'rgba(217, 119, 6, 0.5)',
        citrus: 'rgba(251, 191, 36, 0.45)'
      };

      function redrawL1() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawTopDownTurkeyOnCanvas(ctx, 160, 110, 0.92);

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 22;
        ctx.strokeStyle = sauceColors[gameState.L1.sauce] || sauceColors.herb;

        gameState.L1.strokes.forEach(pt => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 12, 0, Math.PI * 2);
          ctx.fillStyle = sauceColors[gameState.L1.sauce] || sauceColors.herb;
          ctx.fill();
        });
      }

      redrawL1();

      let painting = false;
      function addStroke(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        if (Math.hypot(x - 160, y - 110) < 88) {
          gameState.L1.strokes.push({ x, y });
          const cov = Math.min(100, Math.round((gameState.L1.strokes.length / 55) * 100));
          gameState.L1.coverage = cov;
          gameState.scores.L1 = Math.max(3, Math.round((cov / 100) * 15));
          const covEl = document.getElementById('l1CovText');
          if (covEl) covEl.textContent = `${cov}%`;
          redrawL1();
        }
      }

      canvas.addEventListener('pointerdown', (e) => { painting = true; addStroke(e); });
      canvas.addEventListener('pointermove', (e) => { if (painting) addStroke(e); });
      window.addEventListener('pointerup', () => { painting = false; });
    }

    function initL2DragAndDrop() {
      const tray = document.getElementById('roastingTray');
      const items = document.querySelectorAll('.veggie-drag-item');
      if (!tray || !items.length) return;

      items.forEach(el => {
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const vid = el.getAttribute('data-vid');
          const vemoji = el.getAttribute('data-vemoji');

          const ghost = document.createElement('div');
          ghost.textContent = vemoji;
          ghost.className = 'fixed text-3xl pointer-events-none z-50 -translate-x-1/2 -translate-y-1/2 drop-shadow-xl';
          ghost.style.left = `${e.clientX}px`;
          ghost.style.top = `${e.clientY}px`;
          document.body.appendChild(ghost);

          function onMove(ev) {
            ghost.style.left = `${ev.clientX}px`;
            ghost.style.top = `${ev.clientY}px`;
          }

          function onUp(ev) {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
            ghost.remove();

            const rect = tray.getBoundingClientRect();
            if (ev.clientX >= rect.left && ev.clientX <= rect.right && ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
              const pctX = Math.round(((ev.clientX - rect.left) / rect.width) * 100);
              const pctY = Math.round(((ev.clientY - rect.top) / rect.height) * 100);

              // Check center turkey overlap
              if (Math.hypot(pctX - 50, pctY - 50) < 20) {
                gameState.L2.warning = true;
              } else {
                gameState.L2.warning = false;
                gameState.L2.placed.push({ id: vid, emoji: vemoji, x: Math.max(10, Math.min(90, pctX)), y: Math.max(14, Math.min(86, pctY)) });
                gameState.scores.L2 = Math.min(15, Math.round((gameState.L2.placed.length / 6) * 15));
              }
              renderCurrentLevel();
            }
          }

          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });
      });
    }

      gameState.L3.angle = parseInt(val, 10);

      if (el) el.textContent = `${gameState.L3.angle}°`;

    }

    function classifyPointZone(x, y) {
      if (Math.hypot(x - 170, y - 110) <= 23) return 'bone';
      const cdx = (x - 220) / 30;
      const cdy = (y - 135) / 20;
      if (cdx * cdx + cdy * cdy <= 1.0) return 'air';
      const bdx = (x - 170) / 90;
      const bdy = (y - 108) / 62;
      if (bdx * bdx + bdy * bdy <= 1.0) return 'meat';
      return 'air';
    }

    function initL3ProbeCanvas() {
      const canvas = document.getElementById('probeCanvas');
      if (!canvas) return;
      drawProbeCanvas();

      let dragMode = null;
      canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const my = (e.clientY - rect.top) * (canvas.height / rect.height);

        const rad = (-gameState.L3.angle * Math.PI) / 180;
        const tipX = gameState.L3.entryX + Math.cos(rad) * gameState.L3.depth;
        const tipY = gameState.L3.entryY + Math.sin(rad) * gameState.L3.depth;

        if (Math.hypot(mx - gameState.L3.entryX, my - gameState.L3.entryY) < 22) {
          dragMode = 'handle';
        } else if (Math.hypot(mx - tipX, my - tipY) < 26) {
          dragMode = 'tip';
        } else {
          dragMode = 'handle';
          gameState.L3.entryX = Math.max(40, Math.min(150, mx));
          gameState.L3.entryY = Math.max(60, Math.min(165, my));
          drawProbeCanvas();
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!dragMode) return;
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const my = (e.clientY - rect.top) * (canvas.height / rect.height);

        if (dragMode === 'handle') {
          gameState.L3.entryX = Math.max(40, Math.min(150, Math.round(mx)));
          gameState.L3.entryY = Math.max(60, Math.min(165, Math.round(my)));
        } else if (dragMode === 'tip') {
          const dx = mx - gameState.L3.entryX;
          const dy = my - gameState.L3.entryY;
          const dist = Math.max(25, Math.min(115, Math.round(Math.hypot(dx, dy))));
          const deg = Math.max(-45, Math.min(65, Math.round((-Math.atan2(dy, dx) * 180) / Math.PI)));
          gameState.L3.depth = dist;
          gameState.L3.angle = deg;
          const dEl = document.getElementById('depthVal');
          const aEl = document.getElementById('angleVal');
          if (dEl) dEl.textContent = `${dist} mm`;
          if (aEl) aEl.textContent = `${deg}°`;
        }
        drawProbeCanvas();
      });

      window.addEventListener('pointerup', () => { dragMode = null; });
    }

    function drawProbeCanvas() {
      const canvas = document.getElementById('probeCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const entryX = gameState.L3.entryX;
      const entryY = gameState.L3.entryY;
      const rad = (-gameState.L3.angle * Math.PI) / 180;
      const len = gameState.L3.depth;

      const s1 = { x: entryX + Math.cos(rad) * len, y: entryY + Math.sin(rad) * len };
      const s2 = { x: entryX + Math.cos(rad) * (len * 0.65), y: entryY + Math.sin(rad) * (len * 0.65) };
      const s3 = { x: entryX + Math.cos(rad) * (len * 0.35), y: entryY + Math.sin(rad) * (len * 0.35) };

      gameState.L3.diagnostics = {
        zone1: classifyPointZone(s1.x, s1.y),
        zone2: classifyPointZone(s2.x, s2.y),
        zone3: classifyPointZone(s3.x, s3.y)
      };

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Turkey Cross-Section Body (Warm Golden-Peach Breast Meat)
      ctx.fillStyle = '#F7C59F';
      ctx.beginPath();
      ctx.ellipse(170, 108, 90, 62, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#C2410C';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Keel Bone Region
      ctx.fillStyle = 'rgba(226, 0, 21, 0.16)';
      ctx.beginPath();
      ctx.arc(170, 110, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(226, 0, 21, 0.45)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#991B1B';
      ctx.font = 'bold 9px monospace';
      ctx.fillText('KEEL BONE', 145, 113);

      // Hollow Cavity Region
      ctx.fillStyle = 'rgba(255, 255, 255, 0.72)';
      ctx.beginPath();
      ctx.ellipse(220, 135, 30, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#D97706';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#92400E';
      ctx.fillText('CAVITY', 204, 138);

      // Probe Metal Shaft
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      ctx.moveTo(entryX, entryY);
      ctx.lineTo(s1.x, s1.y);
      ctx.stroke();

      // Probe Entry Handle
      ctx.fillStyle = '#D97724';
      ctx.beginPath();
      ctx.arc(entryX, entryY, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 3 Neutral Sensor Nodes
      [s1, s2, s3].forEach((pt) => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#F59E0B';
        ctx.fill();
        ctx.strokeStyle = '#78350F';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      // Tip Pointer Dot
      ctx.fillStyle = '#E20015';
      ctx.beginPath();
      ctx.arc(s1.x, s1.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function finalizeL3AndNext() {
      const diag = gameState.L3.diagnostics;
      if (diag) {
        const idealX = 85, idealY = 140;
        const posDist = Math.hypot(gameState.L3.entryX - idealX, gameState.L3.entryY - idealY);
        const posScore = Math.max(2, Math.round(8 - (posDist / 12)));

        const angleDiff = Math.abs(gameState.L3.angle - 25);
        const angleScore = Math.max(1, Math.round(5 - (angleDiff / 8)));

        let depthScore = 7;
        if (diag.zone1 === 'bone' || diag.zone2 === 'bone' || diag.zone3 === 'bone') depthScore -= 4;
        if (diag.zone1 === 'air' || diag.zone2 === 'air' || diag.zone3 === 'air') depthScore -= 3;
        depthScore = Math.max(1, depthScore);

        gameState.scores.L3 = Math.min(20, posScore + angleScore + depthScore);
      }
      currentLevel = 4;
      renderCurrentLevel();
    }

    }

    function resetFullGame() {
      gameState.scores = { L1: 0, L2: 0, L3: 0, L4: 0, L5: 0, L6: 0 };
      gameState.L1 = { sauce: 'herb', coverage: 0, strokes: [] };
      gameState.L2 = { placed: [], warning: false };
      gameState.L3 = { entryX: 85, entryY: 140, angle: 25, depth: 72, diagnostics: null };
      gameState.L4 = { temp: 165, airflow: 70 };
      gameState.L5 = { gaugePos: 15, dir: 1, holding: false, bestScore: 0 };
      gameState.L6 = { answered: false, isCorrect: false };
      currentLevel = 0;
      renderCurrentLevel();
    }

    /* ==========================================================================
       12. MAIN VIEW ROUTER
       ========================================================================== */
    function renderCurrentLevel() {
      const container = document.getElementById('appContainer');
      if (!container) return;
      stopL5Loop();

      if (currentLevel === 0) {
        container.innerHTML = renderIntroHTML();
      } else if (currentLevel === 1) {
        container.innerHTML = renderL1HTML();
        initL1Canvas();
      } else if (currentLevel === 2) {
        container.innerHTML = renderL2HTML();
        initL2DragAndDrop();
      } else if (currentLevel === 3) {
        container.innerHTML = renderL3HTML();
        initL3ProbeCanvas();
      } else if (currentLevel === 4) {
        container.innerHTML = renderL4HTML();
      } else if (currentLevel === 5) {
        container.innerHTML = renderL5HTML();
        initL5SteamLoop();
      } else if (currentLevel === 6) {
        container.innerHTML = renderL6HTML();
      } else {
        container.innerHTML = renderResultHTML();
        generateCertificateCanvas();
      }
    }

    window.onload = function() {
      document.documentElement.lang = currentLang;
      updateTicker();
      renderCurrentLevel();
    };
  </script>
</body>
</html>
